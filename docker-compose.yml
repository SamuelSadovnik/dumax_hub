services:
  db:
    image: postgres:16-alpine
    container_name: dumax_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dumax
      POSTGRES_PASSWORD: dumax
      POSTGRES_DB: dumax_hub
    ports:
      - "5433:5432"
    volumes:
      - dumax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumax -d dumax_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dumax_pg:
